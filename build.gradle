// Plugins: 'java' compila el código y corre las pruebas; 'application' permite usar "gradle run".
plugins {
    id 'java'
    id 'application'
}

// Grupo y versión del proyecto. Sirven para identificarlo, no cambian cómo funciona.
group = 'co.com.semillero'
version = '1.0'

// Versión de Java con la que se compila. Usamos Java 21, la misma que instalas en tu equipo.
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// De dónde descarga Gradle las librerías. Maven Central es el repositorio público más usado.
repositories {
    mavenCentral()
}

// Librerías del proyecto. Solo necesitamos JUnit 5 para escribir y correr las pruebas.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Clase que se ejecuta con "gradle run". Es la que tiene el método main.
application {
    mainClass = 'co.com.semillero.App'
}

// Lee y escribe los archivos en UTF-8 para que las tildes y la ñ se vean bien.
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// Le dice a Gradle que las pruebas son de JUnit 5 y que muestre en consola cada prueba que corre.
test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
