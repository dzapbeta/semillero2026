// Plugins: 'java' compila el código Java y 'application' permite ejecutarlo con "gradle run".
plugins {
    id 'java'
    id 'application'
}

// Grupo y versión del proyecto. Sirven para identificarlo, no cambian cómo funciona.
group = 'co.com.semillero'
version = '1.0'

// Versión de Java con la que se compila. Usamos Java 21, la misma que instalas en tu equipo.
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Clase que se ejecuta con "gradle run". Es la que tiene el método main.
application {
    mainClass = 'co.com.semillero.App'
}

// Lee y escribe los archivos en UTF-8 para que las tildes y la ñ de los comentarios no den problemas.
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
