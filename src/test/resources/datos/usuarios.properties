# Usuarios de prueba de Sauce Demo (son públicos: aparecen en la página de login).
# Formato: <tipo>.usuario y <tipo>.clave. El <tipo> es el texto que se usa en los features.

# Usuario estandar: puede iniciar sesión y comprar.
estandar.usuario=standard_user
estandar.clave=secret_sauce

# Usuario bloqueado: la tienda le niega el acceso con un mensaje de error.
bloqueado.usuario=locked_out_user
bloqueado.clave=secret_sauce
