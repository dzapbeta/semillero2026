# junit-platform.properties: configuración del motor de Cucumber en JUnit Platform.

# Oculta el aviso de Cucumber que invita a publicar reportes en internet.
cucumber.publish.quiet=true
# Ejecución en serie (un escenario a la vez): en clase se ve el navegador paso a paso.
cucumber.execution.parallel.enabled=false
# Muestra los fragmentos de código sugeridos para pasos sin definir con estilo camelCase.
cucumber.snippet-type=camelcase
