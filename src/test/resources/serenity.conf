# Configuración de Serenity: capturas, modo del navegador y opciones de Chrome.

# Toma una captura después de cada paso para verla en el reporte.
serenity {
  take.screenshots = AFTER_EACH_STEP
}

# false: se ve el navegador (así lo usamos en clase). true: corre sin ventana.
# Para cambiarlo sin tocar el archivo: gradle clean test "-Dheadless.mode=true"
headless.mode = false

# Navegador que se usa. Selenium descarga solo el driver que corresponde a tu Chrome.
webdriver {
  driver = chrome
  # Opciones de arranque de Chrome: tamaño de ventana, incógnito y sin avisos que tapen botones.
  capabilities {
    "goog:chromeOptions" {
      args = ["--window-size=1366,900", "--incognito", "--disable-notifications", "--remote-allow-origins=*"]
    }
  }
}
