# ============================================================================================
# serenity.conf: configuración de Serenity BDD y de la API bajo prueba (formato HOCON).
# Serenity lo lee automáticamente desde src/test/resources al ejecutar las pruebas.
# Cualquier valor se puede sobrescribir al ejecutar con -Dpropiedad=valor
#   Ejemplo: mvn clean verify -Drestapi.baseurl=https://otra-url.com
# ============================================================================================

serenity {
  # Nombre que aparece en la parte superior del reporte HTML
  project.name = "Semillero QA 2026 · Clase 3 · Screenplay API + Data Driven (DummyJSON)"
  # Las pruebas de API no abren navegador: no hay capturas de pantalla que tomar
  take.screenshots = DISABLED
}

restapi {
  # URL base de la API. Las tareas solo usan rutas relativas (utils/Endpoints.java) y se pegan a esta URL
  baseurl = "https://dummyjson.com"
  # Tiempo máximo de espera por petición, en milisegundos. Si la API no responde en ese tiempo, la prueba falla
  timeout.ms = 15000
}
