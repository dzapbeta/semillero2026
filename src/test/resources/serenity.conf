# serenity.conf: configuración de Serenity BDD (formato HOCON: bloques con llaves).
# Cualquier valor se puede cambiar al ejecutar con -Dpropiedad=valor.

# Bloque serenity: nombre del proyecto en el reporte, capturas y manejo del navegador.
serenity {
  # Nombre que aparece en la parte superior del reporte HTML.
  project.name = "Semillero QA 2026 - Sauce Demo (Screenplay Web)"
  # Toma una captura de pantalla después de cada paso (se ven en el reporte).
  take.screenshots = AFTER_EACH_STEP
  # Abre un navegador nuevo en cada escenario: los escenarios no comparten carrito ni sesión.
  restart.browser.for.each = scenario
}

# false = se ve el navegador (ideal en clase). Para ocultarlo: mvn clean verify -Dheadless.mode=true
headless.mode = false

# Bloque webdriver: qué navegador usar y con qué opciones (Chrome por defecto).
webdriver {
  # Navegador por defecto. Serenity y Selenium Manager descargan el driver compatible solos.
  driver = chrome
  # Capacidades: opciones que se le pasan al navegador al abrirlo.
  capabilities {
    # Nombre técnico del navegador para Selenium.
    browserName = "chrome"
    # Opciones propias de Chrome.
    "goog:chromeOptions" {
      # Argumentos de arranque: ventana amplia, modo incógnito y sin barras/avisos que estorben.
      args = ["--window-size=1366,900", "--incognito", "--disable-infobars", "--disable-extensions",
              "--disable-notifications", "--remote-allow-origins=*"]
      # Preferencias: desactiva el gestor de contraseñas (su ventana emergente tapa los botones).
      prefs {
        credentials_enable_service = false
        "profile.password_manager_enabled" = false
        "profile.password_manager_leak_detection" = false
      }
    }
  }
}

# Bloque environments: valores que cambian según el ambiente (-Denvironment=nombre).
environments {
  # default: se usa cuando NO se indica -Denvironment. URL de la aplicación bajo prueba.
  default {
    webdriver.base.url = "https://www.saucedemo.com"
  }
}
