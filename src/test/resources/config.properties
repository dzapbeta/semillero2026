# ---------------------------------------------------------------------------
# config.properties — Configuración de las pruebas (la lee utils/Configuracion.java).
# Cualquier valor se puede sobreescribir al ejecutar, sin editar este archivo:
#   mvn clean test -Dheadless=false -DslowMo=500 -Dnavegador=firefox
# ---------------------------------------------------------------------------

# URL de la aplicación bajo prueba (la misma de las clases 2 y 3).
baseUrl=https://www.saucedemo.com

# true = el navegador corre sin ventana (rápido, ideal para CI). false = se ve en pantalla.
headless=true

# Navegador a usar: chromium, firefox o webkit.
navegador=chromium

# Pausa en milisegundos entre cada acción. 0 = normal. 500 = cámara lenta para explicar en clase.
slowMo=0

# Tiempo máximo (ms) que Playwright espera a un elemento o a que una aserción se cumpla.
timeoutMs=10000

# Cuándo guardar la traza en target/trazas: "fallos" (solo si la prueba falla) o "siempre".
guardarTraza=fallos
